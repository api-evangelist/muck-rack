domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY check, deliberately left empty. The PR / earned-media measurement market
    has no adopted machine-readable interchange standard that Muck Rack's contract could
    declare — there is no SCIM/OData/OpenRTB/HL7/ISO-20022 equivalent for media coverage
    data. AMEC's Barcelona Principles and Integrated Evaluation Framework exist as
    measurement GUIDANCE for the sector but define no wire format, schema or identifier
    scheme, so they are not a domain standard a contract can conform to. Muck Rack is not
    penalised for the absence, and nothing is invented to fill the slot.
  candidates_considered:
  - id: amec-integrated-evaluation-framework
    is_wire_standard: false
    reason: Measurement methodology guidance; defines no schema, media type or identifier scheme.
  - id: iptc-ninjs
    is_wire_standard: true
    conforms: unknown
    reason: >-
      IPTC ninjs is the news-industry JSON standard for news items and would be the
      plausible domain standard for article payloads. Muck Rack's article payload is not
      publicly observable, so conformance cannot be established either way. Recorded as a
      lead for a future authenticated review, NOT as a conformance claim.
