  header: 'Authorization: Bearer <api key>'
  see: authentication/muck-rack-authentication.yml
idempotency:
  supported: na
  reason: >-
    The public surface exposes no write operations. The router at /api/saved-searches/
    returns `Allow: GET, HEAD, OPTIONS`, so every observable method is already safe and
    idempotent by HTTP semantics. There is no unsafe operation for an idempotency key to
    protect, which makes this `na` rather than a failure.
  header: null
  scope: null
  retention: null
  evidence: 'Allow: GET, HEAD, OPTIONS on https://muckrack.com/api/saved-searches/'
pagination:
  style: unknown
  note: >-
    Cannot be established anonymously — the collection endpoint returns 403 before any
    payload. Django REST Framework defaults to either PageNumberPagination
    (`?page=`) or LimitOffsetPagination (`?limit=&offset=`) with a
    {count, next, previous, results} envelope, but which (if either) is configured is
    not publicly documented and is NOT asserted here.
  params: []
  response_fields: []
