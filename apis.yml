aid: muck-rack
name: Muck Rack
description: 'Muck Rack is a public relations and earned-media software platform that
  combines a journalist and media-outlet database, media monitoring across news, print,
  broadcast, social and generative AI engines, pitching and press-release distribution,
  and executive-ready earned-media reporting. The Muck Rack API is a paid add-on for
  Premier-tier customers that provides programmatic access to the article data behind
  a Saved Search, so communications teams can pipe earned coverage into internal systems
  such as Snowflake or business-intelligence tools such as Power BI and Tableau. API
  keys are issued by an account Admin under Organization Settings, and the API reference
  itself is published only to authenticated customers.'
