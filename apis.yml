apis:
- name: Muck Rack API
  description: 'Read-only REST API providing programmatic access to the article data
    behind a Muck Rack Saved Search. Sold as an add-on to Premier-tier subscriptions;
    authenticated with an organization API key presented as an HTTP Bearer credential.
    The public surface observed anonymously is a Django REST Framework router mounted
    at /api/saved-searches/, which answers GET, HEAD and OPTIONS only. The full API
    reference is published to authenticated customers only.'
