note: >-
  Muck Rack publishes no error reference and no OpenAPI, so this catalog records only
  error shapes OBSERVED on the live unauthenticated surface. It is deliberately short:
  every entry below was actually returned by the origin. The envelope is the Django
  REST Framework default, a flat object with a single human-readable `detail` string.
  It is NOT RFC 9457 application/problem+json — there is no `type`, `title`, `status`
  or `instance` member, and the content type is application/json. There is no
  machine-readable error code, so an agent can only branch on HTTP status plus English
  string matching, which is brittle.
